name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: stagegrid, POSTGRES_PASSWORD: stagegrid, POSTGRES_DB: stagegrid }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U stagegrid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://stagegrid:stagegrid@localhost:54329/stagegrid_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-e2e:
    runs-on: ubuntu-latest
    needs: [check, test]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: stagegrid, POSTGRES_PASSWORD: stagegrid, POSTGRES_DB: stagegrid }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U stagegrid" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-packs.mjs
      - run: node scripts/smoke-create.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
