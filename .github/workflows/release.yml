name: Release

# Run by hand: Actions → Release → Run workflow (on main).
#  - With pending changesets it opens (or updates) a "chore: version packages" PR.
#  - After that PR is merged, run it again: it publishes to npm, tags vX.Y.Z with a GitHub release,
#    and pushes the Docker image. Re-running is safe and finishes anything left undone.
# Needs the repository secret NPM_TOKEN (an npm token allowed to publish @stagegrid/* and create-stagegrid).
on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-packs.mjs

      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # changesets/action does not recognise @changesets/cli 3's publish output (it never reports
      # "published"), so decide from the registry itself. This also makes re-running the workflow
      # a safe way to finish a release: every step below skips what is already done.
      - id: npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=true
          for pkg in @stagegrid/core @stagegrid/mcp create-stagegrid; do
            if [ "$(npm view "$pkg@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$pkg@$version is on npm"
            else
              echo "::warning::$pkg@$version is not on npm yet — approve it under npmjs.com → Staged Packages if it is there, then run Release again"
              published=false
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Tag and GitHub release
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/core/CHANGELOG.md > /tmp/notes.md
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file /tmp/notes.md
          fi

      - if: steps.npm.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: steps.npm.outputs.published == 'true'
        run: |
          if docker buildx imagetools inspect "ghcr.io/stagegrid/stagegrid:${{ steps.npm.outputs.version }}" >/dev/null 2>&1; then
            echo "Image ${{ steps.npm.outputs.version }} already pushed"; echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.push == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.image.outputs.push == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stagegrid/stagegrid:${{ steps.npm.outputs.version }}
            ghcr.io/stagegrid/stagegrid:latest
          labels: |
            org.opencontainers.image.source=https://github.com/stagegrid/stagegrid
            org.opencontainers.image.version=${{ steps.npm.outputs.version }}
            org.opencontainers.image.licenses=MIT
