name: Release

# Run by hand: Actions → Release → Run workflow (on main).
#  - With pending changesets it opens (or updates) a "chore: version packages" PR.
#  - After that PR is merged, run it again: it publishes to npm and pushes the Docker image.
# Needs the repository secret NPM_TOKEN (an npm token allowed to publish @stagegrid/* and create-stagegrid).
on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-packs.mjs

      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.changesets.outputs.published == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.changesets.outputs.published == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.changesets.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changesets.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stagegrid/stagegrid:${{ steps.version.outputs.version }}
            ghcr.io/stagegrid/stagegrid:latest
          labels: |
            org.opencontainers.image.source=https://github.com/stagegrid/stagegrid
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
